# Panel efactura-admin en http://<servidor>:${PANEL_PORT:-8080}
#   docker compose up -d --build
# Variables (en el entorno o en un archivo .env junto a este):
#   PANEL_PORT    puerto publicado en el servidor (por defecto 8080; Podman sin root no permite < 1024)
#   API_UPSTREAM  URL de la API, sin /api/v1 (obligatoria, ej. http://<servidor-api>:9000)
services:
  efactura-admin:
    build:
      context: .
    image: efactura-admin
    container_name: efactura-admin
    ports:
      - "${PANEL_PORT:-8080}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:?Falta API_UPSTREAM (URL de la API, sin /api/v1) en el entorno o en .env}
    # Tambien esta en el Dockerfile, pero Podman construye en formato OCI y ese HEALTHCHECK se descarta; desde compose
    # se aplica al crear el contenedor (docker ps / podman ps muestran "healthy")
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
